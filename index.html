<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06040f" />
    <meta name="color-scheme" content="dark" />

    <title>Easter Eggs — 60 Developer Secrets, All Playable</title>
    <meta
      name="description"
      content="Sixty developer easter eggs in an arcade cabinet. Konami codes, barrel rolls, ASCII fire, a playable T-Rex — every one runs in the browser, and every one comes with the code. Collect all 60."
    />
    <meta name="author" content="AJ" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Easter Eggs — 60 Developer Secrets, All Playable" />
    <meta
      property="og:description"
      content="Sixty easter eggs, all playable in the browser. Collect all 60."
    />
    <meta property="og:site_name" content="Easter Eggs" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Easter Eggs — 60 Developer Secrets, All Playable" />
    <meta
      name="twitter:description"
      content="Sixty easter eggs, all playable in the browser. Collect all 60."
    />

    <!--
      Favicon as an inline data URI: a gold egg on the noir stage, lit from
      the upper left like everything else on the site. No extra request, and
      nothing to 404 on a fresh clone.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='38%25' cy='28%25'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='0.5' stop-color='%23e4dcff'/%3E%3Cstop offset='1' stop-color='%23b06cff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%2306040f'/%3E%3Cpath d='M16 5c4.2 0 7.5 6 7.5 11.2S20.4 26 16 26s-7.5-4.6-7.5-9.8S11.8 5 16 5z' fill='url(%23g)'/%3E%3Ccircle cx='13' cy='16' r='1.6' fill='%23241d40'/%3E%3Ccircle cx='19' cy='16' r='1.6' fill='%23241d40'/%3E%3C/svg%3E"
    />

    <!-- Preconnect: fonts are the only third-party request on the page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Paint the stage before React boots. Without this the browser flashes
      its default white for a frame or two, which on a page this dark reads
      as a camera flash going off in your face.
    -->
    <style>
      html,
      body,
      #root {
        background: #06040f;
        margin: 0;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; color: #cdc7ee; font-family: system-ui, sans-serif">
        <h1 style="color: #00e5ff">Easter Eggs</h1>
        <p>This cabinet needs JavaScript — the previews are the whole point.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
